groups:
  - name: spending-guard-core
    rules:
      - alert: SpendingGuardBackendDown
        expr: up{job="spending-guard-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Spending Guard backend metrics target is unavailable

      - alert: SpendingGuardHighServerErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{application="spending-guard-api",status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_server_requests_seconds_count{application="spending-guard-api"}[5m])), 0.001)
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Backend 5xx ratio exceeded 5 percent for five minutes

      - alert: SpendingGuardOutboxPublishFailure
        expr: increase(spending_guard_outbox_publish_failure_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: At least one Outbox event failed to publish

      - alert: SpendingGuardAnalysisConsumeFailure
        expr: increase(spending_guard_analysis_consume_failure_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: At least one spend analysis message failed

      - alert: SpendingGuardJvmHeapPressure
        expr: |
          sum(jvm_memory_used_bytes{application="spending-guard-api",area="heap"})
          /
          clamp_min(sum(jvm_memory_max_bytes{application="spending-guard-api",area="heap"}), 1)
          > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Backend JVM heap usage exceeded 85 percent for ten minutes
