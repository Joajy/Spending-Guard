name: spending-guard-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: spending_guard
      POSTGRES_USER: spending_guard
      POSTGRES_PASSWORD: local_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spending_guard -d spending_guard"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.8.1
    ports:
      - "9092:9092"

volumes:
  postgres-data:
