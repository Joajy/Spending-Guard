name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "postman/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "postman/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: backend/*.gradle

      - name: Grant Gradle Wrapper permission
        run: chmod +x gradlew

      - name: Run backend tests
        run: ./gradlew clean test jacocoTestReport --no-daemon

      - name: Summarize verification metrics
        if: always()
        run: |
          python - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET

          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          parser_evaluation = {"tests": 0, "failed": 0, "skipped": 0}
          risk_evaluation = {"tests": 0, "failed": 0, "skipped": 0}
          for report in glob.glob("build/test-results/test/TEST-*.xml"):
              suite = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(suite.attrib.get(key, 0))
              if suite.attrib.get("name", "").endswith("FastSpendEventParserEvaluationTest"):
                  parser_evaluation["tests"] += int(suite.attrib.get("tests", 0))
                  parser_evaluation["failed"] += (
                      int(suite.attrib.get("failures", 0))
                      + int(suite.attrib.get("errors", 0))
                  )
                  parser_evaluation["skipped"] += int(suite.attrib.get("skipped", 0))
              if suite.attrib.get("name", "").endswith("SpendRiskClassifierEvaluationTest"):
                  risk_evaluation["tests"] += int(suite.attrib.get("tests", 0))
                  risk_evaluation["failed"] += (
                      int(suite.attrib.get("failures", 0))
                      + int(suite.attrib.get("errors", 0))
                  )
                  risk_evaluation["skipped"] += int(suite.attrib.get("skipped", 0))

          executed = totals["tests"] - totals["skipped"]
          passed = executed - totals["failures"] - totals["errors"]
          pass_rate = (passed / executed * 100) if executed else 0.0

          coverage_path = "build/reports/jacoco/test/jacocoTestReport.xml"
          counters = {}
          if os.path.exists(coverage_path):
              coverage = ET.parse(coverage_path).getroot()
              counters = {
                  counter.attrib["type"]: (
                      int(counter.attrib["covered"]),
                      int(counter.attrib["missed"]),
                  )
                  for counter in coverage.findall("counter")
              }

          def percentage(counter_type):
              covered, missed = counters.get(counter_type, (0, 0))
              total = covered + missed
              return covered / total * 100 if total else 0.0

          parser_executed = parser_evaluation["tests"] - parser_evaluation["skipped"]
          parser_correct = parser_executed - parser_evaluation["failed"]
          parser_accuracy = (
              parser_correct / parser_executed * 100 if parser_executed else 0.0
          )
          risk_executed = risk_evaluation["tests"] - risk_evaluation["skipped"]
          risk_correct = risk_executed - risk_evaluation["failed"]
          risk_accuracy = risk_correct / risk_executed * 100 if risk_executed else 0.0

          summary = (
              f"Tests: {passed}/{executed} passed ({pass_rate:.2f}%)\n"
              f"Failures: {totals['failures']}, Errors: {totals['errors']}, "
              f"Skipped: {totals['skipped']}\n"
              f"Fast parser evaluation: {parser_correct}/{parser_executed} correct "
              f"({parser_accuracy:.2f}%)\n"
              f"Risk classifier evaluation: {risk_correct}/{risk_executed} correct "
              f"({risk_accuracy:.2f}%)\n"
              f"Line coverage: {percentage('LINE'):.2f}%\n"
              f"Branch coverage: {percentage('BRANCH'):.2f}%"
          )
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("## Backend verification\n\n")
              output.write(summary.replace("\n", "  \n"))
              output.write("\n")
          PY

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            backend/build/reports/tests/test
            backend/build/reports/jacoco/test
          if-no-files-found: warn
          retention-days: 14

  postman:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: spending_guard
          POSTGRES_USER: spending_guard
          POSTGRES_PASSWORD: local_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spending_guard -d spending_guard"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.30.3
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DB_URL: jdbc:postgresql://localhost:5432/spending_guard
      DB_USERNAME: spending_guard
      DB_PASSWORD: local_password
      OUTBOX_PUBLISHER_ENABLED: "false"
      SPEND_EVENT_CONSUMER_ENABLED: "false"
      MAIL_HOST: localhost
      MAIL_PORT: "1025"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: backend/*.gradle

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Start API
        working-directory: backend
        run: |
          chmod +x gradlew
          mkdir -p build/postman
          ./gradlew bootRun --no-daemon > build/postman/application.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8080/api/v1/status > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat build/postman/application.log
          exit 1

      - name: Run Postman collection
        run: >-
          npx --yes newman@6 run postman/Spending-Guard.postman_collection.json
          --reporters cli,json,junit
          --reporter-json-export backend/build/postman/newman.json
          --reporter-junit-export backend/build/postman/newman.xml

      - name: Summarize Postman results
        if: always()
        run: |
          if [ ! -f backend/build/postman/newman.json ]; then
            exit 0
          fi
          node <<'JS'
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('backend/build/postman/newman.json', 'utf8'));
          const stats = result.run.stats;
          const assertions = stats.assertions;
          const requests = stats.requests;
          const passed = assertions.total - assertions.failed;
          const rate = assertions.total === 0 ? 0 : passed / assertions.total * 100;
          const summary = [
            '## Postman API verification',
            '',
            `Requests: ${requests.total - requests.failed}/${requests.total} succeeded`,
            `Assertions: ${passed}/${assertions.total} passed (${rate.toFixed(2)}%)`,
            `Failed assertions: ${assertions.failed}`,
            `Average response time: ${result.run.timings.responseAverage.toFixed(2)} ms`,
          ].join('  \n');
          console.log(summary.replaceAll('  \n', '\n'));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + '\n');
          JS

      - name: Upload Postman reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: postman-test-reports
          path: backend/build/postman
          if-no-files-found: warn
          retention-days: 14
