name: Deployment config

on:
  pull_request:
    paths:
      - "deploy/**"
      - "scripts/deployment/**"
      - ".github/workflows/deployment-config.yml"

permissions:
  contents: read

concurrency:
  group: deployment-config-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run deployment contract tests
        run: python -m unittest discover -s scripts/deployment/tests -p "test_*.py"

      - name: Validate resolved production Compose model
        run: python scripts/deployment/verify_production_compose.py
