name: Full-stack smoke

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/smoke/**"
      - "compose.yaml"
      - ".github/workflows/full-stack-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-stack-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate smoke test helpers
        run: python -m unittest discover -s scripts/smoke/tests -p "test_*.py"

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Start full stack
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: Run user journey
        run: python scripts/smoke/full_stack_smoke.py

      - name: Show service state on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail 250

      - name: Stop full stack
        if: always()
        run: docker compose down --volumes --remove-orphans
