spring:
  application:
    name: spending-guard-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/spending_guard}
    username: ${DB_USERNAME:spending_guard}
    password: ${DB_PASSWORD:local_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true

spending-guard:
  outbox:
    publisher:
      enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
      topic: ${OUTBOX_PUBLISHER_TOPIC:spend-event.received.v1}
      batch-size: ${OUTBOX_PUBLISHER_BATCH_SIZE:20}
      fixed-delay: ${OUTBOX_PUBLISHER_FIXED_DELAY:1000}
      lease-duration: ${OUTBOX_PUBLISHER_LEASE_DURATION:30s}
      retry-base-delay: ${OUTBOX_PUBLISHER_RETRY_BASE_DELAY:5s}
      retry-max-delay: ${OUTBOX_PUBLISHER_RETRY_MAX_DELAY:5m}
      send-timeout: ${OUTBOX_PUBLISHER_SEND_TIMEOUT:5s}

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

