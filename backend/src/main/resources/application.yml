spring:
  application:
    name: spending-guard-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/spending_guard}
    username: ${DB_USERNAME:spending_guard}
    password: ${DB_PASSWORD:local_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS_ENABLE:false}
      mail.smtp.connectiontimeout: ${MAIL_CONNECTION_TIMEOUT:3000}
      mail.smtp.timeout: ${MAIL_READ_TIMEOUT:5000}
      mail.smtp.writetimeout: ${MAIL_WRITE_TIMEOUT:5000}

spending-guard:
  security:
    issuer: ${JWT_ISSUER:https://spending-guard.local}
    secret: ${JWT_SECRET:local-development-secret-change-me-32-bytes}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:14d}
  mail:
    from: ${MAIL_FROM:no-reply@spending-guard.local}
  outbox:
    publisher:
      enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
      topic: ${OUTBOX_PUBLISHER_TOPIC:spend-event.received.v1}
      batch-size: ${OUTBOX_PUBLISHER_BATCH_SIZE:20}
      fixed-delay: ${OUTBOX_PUBLISHER_FIXED_DELAY:1000}
      lease-duration: ${OUTBOX_PUBLISHER_LEASE_DURATION:30s}
      retry-base-delay: ${OUTBOX_PUBLISHER_RETRY_BASE_DELAY:5s}
      retry-max-delay: ${OUTBOX_PUBLISHER_RETRY_MAX_DELAY:5m}
      send-timeout: ${OUTBOX_PUBLISHER_SEND_TIMEOUT:5s}
  analysis:
    consumer:
      enabled: ${SPEND_EVENT_CONSUMER_ENABLED:true}
      topic: ${SPEND_EVENT_CONSUMER_TOPIC:spend-event.received.v1}
      group-id: ${SPEND_EVENT_CONSUMER_GROUP_ID:spending-guard-fast-parser-v1}
      max-retries: ${SPEND_EVENT_CONSUMER_MAX_RETRIES:3}
      retry-backoff: ${SPEND_EVENT_CONSUMER_RETRY_BACKOFF:1s}
      dead-letter-topic: ${SPEND_EVENT_CONSUMER_DLT:spend-event.received.v1.DLT}

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
