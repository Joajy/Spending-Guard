openapi: 3.1.0
info:
  title: SpendGuard API
  version: 0.2.0-draft
  description: 현재 구현과 후속 기능의 API 계약 초안
servers:
  - url: http://localhost:8080
tags:
  - name: Users
  - name: Spend Events
  - name: Transactions
  - name: Budgets
  - name: Dashboard
  - name: Integrations
paths:
  /api/v1/users:
    post:
      tags: [Users]
      summary: Register a user account
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUserRequest'
      responses:
        '201':
          description: User account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRegisteredResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email already registered
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/spend-events:
    post:
      tags: [Spend Events]
      summary: Submit a financial notification text
      operationId: submitSpendEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitSpendEventRequest'
      responses:
        '202':
          description: Event accepted for asynchronous processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpendEventAcceptedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Duplicate event
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/spend-events/{eventId}:
    get:
      tags: [Spend Events]
      summary: Get processing status and result
      operationId: getSpendEvent
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Current event state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpendEventDetail'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/transactions:
    get:
      tags: [Transactions]
      summary: List normalized transactions
      operationId: listTransactions
      parameters:
        - name: month
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
        - name: category
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Category'
      responses:
        '200':
          description: Transaction page
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
  /api/v1/transactions/{transactionId}/category:
    patch:
      tags: [Transactions]
      summary: Correct a transaction category
      operationId: correctCategory
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category]
              properties:
                category:
                  $ref: '#/components/schemas/Category'
      responses:
        '200':
          description: Corrected transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
  /api/v1/budgets/{month}:
    get:
      tags: [Budgets]
      summary: Get monthly budgets
      operationId: getMonthlyBudgets
      parameters:
        - $ref: '#/components/parameters/Month'
      responses:
        '200':
          description: Monthly budget status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Budget'
    put:
      tags: [Budgets]
      summary: Replace monthly category budgets
      operationId: replaceMonthlyBudgets
      parameters:
        - $ref: '#/components/parameters/Month'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/BudgetInput'
      responses:
        '200':
          description: Saved budgets
  /api/v1/dashboard/{month}:
    get:
      tags: [Dashboard]
      summary: Get monthly dashboard projection
      operationId: getDashboard
      parameters:
        - $ref: '#/components/parameters/Month'
      responses:
        '200':
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
  /api/v1/integrations/toss-payments/webhook:
    post:
      tags: [Integrations]
      summary: Receive Toss Payments test webhook
      description: Optional MVP adapter. It represents payments of the connected merchant, not the user's complete card history.
      operationId: receiveTossPaymentsWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '202':
          description: Webhook accepted
components:
  parameters:
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Month:
      name: month
      in: path
      required: true
      schema:
        type: string
        pattern: '^\d{4}-\d{2}$'
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    RegisterUserRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
    UserRegisteredResponse:
      type: object
      required: [userId, email, createdAt]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time
    SubmitSpendEventRequest:
      type: object
      required: [source, message]
      properties:
        source:
          type: string
          enum: [MANUAL_TEXT, SIMULATOR]
        externalEventId:
          type: [string, 'null']
          maxLength: 200
        message:
          type: string
          minLength: 1
          maxLength: 2000
        occurredAt:
          type: [string, 'null']
          format: date-time
    SpendEventAcceptedResponse:
      type: object
      required: [eventId, status, receivedAt]
      properties:
        eventId:
          type: string
          format: uuid
        status:
          type: string
          const: RECEIVED
        receivedAt:
          type: string
          format: date-time
    SpendEventDetail:
      type: object
      required: [eventId, source, status, receivedAt]
      properties:
        eventId:
          type: string
          format: uuid
        source:
          type: string
          enum: [MANUAL_TEXT, SIMULATOR]
        status:
          type: string
          enum: [RECEIVED, ANALYZING, NEEDS_REVIEW]
        occurredAt:
          type: [string, 'null']
          format: date-time
        receivedAt:
          type: string
          format: date-time
        fastParse:
          oneOf:
            - $ref: '#/components/schemas/FastParseResult'
            - type: 'null'
    FastParseResult:
      type: object
      required: [currency, status, parserVersion, parsedAt]
      properties:
        amount:
          type: [number, 'null']
          minimum: 0
        currency:
          type: string
          const: KRW
        transactionType:
          type: [string, 'null']
          enum: [PAYMENT, CANCEL, REFUND, null]
        status:
          type: string
          enum: [PARSED, NEEDS_REVIEW]
        reviewReason:
          type: [string, 'null']
        parserVersion:
          type: string
        parsedAt:
          type: string
          format: date-time
    Transaction:
      type: object
      required: [id, amount, currency, transactionType, category, confidence, occurredAt]
      properties:
        id:
          type: string
          format: uuid
        amount:
          type: number
          minimum: 0
        currency:
          type: string
          default: KRW
        transactionType:
          type: string
          enum: [PAYMENT, CANCEL, REFUND]
        merchant:
          type: [string, 'null']
        normalizedMerchant:
          type: [string, 'null']
        category:
          $ref: '#/components/schemas/Category'
        confidence:
          type: number
          minimum: 0
          maximum: 1
        occurredAt:
          type: string
          format: date-time
    Category:
      type: string
      enum: [FOOD, TRANSPORTATION, SHOPPING, SUBSCRIPTION, HOUSING, HEALTH, EDUCATION, LEISURE, TRANSFER, OTHER]
    BudgetInput:
      type: object
      required: [category, budgetAmount]
      properties:
        category:
          $ref: '#/components/schemas/Category'
        budgetAmount:
          type: number
          minimum: 0
    Budget:
      allOf:
        - $ref: '#/components/schemas/BudgetInput'
        - type: object
          required: [spentAmount, utilizationRate]
          properties:
            spentAmount:
              type: number
            utilizationRate:
              type: number
    RiskAssessment:
      type: object
      required: [score, level, policyVersion, signals]
      properties:
        score:
          type: integer
          minimum: 0
          maximum: 100
        level:
          type: string
          enum: [LOW, MEDIUM, HIGH]
        policyVersion:
          type: string
        signals:
          type: array
          items:
            type: object
            required: [type, message]
            properties:
              type:
                type: string
              message:
                type: string
    Dashboard:
      type: object
      required: [month, totalBudget, totalSpent, budgets, recentTransactions, alerts]
      properties:
        month:
          type: string
        totalBudget:
          type: number
        totalSpent:
          type: number
        budgets:
          type: array
          items:
            $ref: '#/components/schemas/Budget'
        recentTransactions:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/RiskAssessment'
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        traceId:
          type: string
